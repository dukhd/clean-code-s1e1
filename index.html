<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <h1 class="main-title">Todo App</h1>
      <img class="matrix-img" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
      <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="add-task-section">
        <h2 class="section-title add-item-title">Add Item</h2>
        <div class="task-row">
          <input id="new-task"class="input task-input" type="text">
          <button class="button add-btn">Add</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">Todo</h2>
        <ul id="incomplete-tasks" class="tasks-list">
          <li class="task-item">
            <input type="checkbox" class="input task-checkbox">
            <label class="task-label">Pay Bills</label>
            <input type="text" class="input task-input">
            <button class="button edit-btn">Edit</button>
            <button class="button delete-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
          <li class="edit-mode task-item">
            <input type="checkbox" class="input task-checkbox">
            <label class="task-label">Go Shopping</label>
            <input type="text" value="go Shopping" class="input task-input">
            <button class="button edit-btn">Save</button>
            <button class="button delete-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="section-title">Completed</h2>
        <ul id="completed-tasks" class="tasks-list">
          <li class="task-item">
            <input type="checkbox" class="input task-checkbox" checked>
            <label class="task-label">See the Doctor</label>
            <input type="text" class="input task-input">
            <button class="button edit-btn">Edit</button>
            <button class="button delete-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
