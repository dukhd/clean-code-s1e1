<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="body">
    <header class="header">
      <h1 class="header__title">Todo App</h1>
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main-content">
      <section class="task-adder">
        <h2 class="task-adder__title">Add Item</h2>
        <div class="task-adder__row">
          <input class="input task-adder__input" type="text">
          <button class="button button_type_add">Add</button>
        </div>
      </section>
      <section class="task-list-section">
        <h2 class="task-list-section__title">Todo</h2>
        <ul class="tasks-list tasks-list_incomplete">
          <li class="task-item">
            <input type="checkbox" class="input task-item__checkbox">
            <label class="task-item__label">Pay Bills</label>
            <input type="text" class="input task-item__text-input">
            <button class="button button_type_edit">Edit</button>
            <button class="button button_type_delete">
              <img class="button__remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
          <li class="task-item task-item_mode_edit">
            <input type="checkbox" class="input task-item__checkbox">
            <label class="task-item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="input task-item__text-input">
            <button class="button button_type_edit">Save</button>
            <button class="button button_type_delete">
              <img class="button__remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
        </ul>
      </section>
      <section class="task-list-section">
        <h2 class="task-list-section__title">Completed</h2>
        <ul class="tasks-list tasks-list_completed">
          <li class="task-item">
            <input type="checkbox" class="input task-item__checkbox" checked>
            <label class="task-item__label">See the Doctor</label>
            <input type="text" class="input task-item__text-input">
            <button class="button button_type_edit">Edit</button>
            <button class="button button_type_delete">
              <img class="button__remove-icon" src="./remove.svg" alt="remove task button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
